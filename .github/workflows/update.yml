name: Nix Flake Check

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate Nix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v24

      - name: Check Nix formatting
        shell: bash
        run: |
          mapfile -d '' nix_files < <(git ls-files -z -- '*.nix')
          nix fmt --no-update-lock-file -- --check "${nix_files[@]}"

      - name: Run flake checks
        run: nix flake check --no-update-lock-file

      - name: Build Neovim
        run: nix build .#nvim --no-link --no-update-lock-file
